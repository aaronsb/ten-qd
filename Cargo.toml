[package]
name = "ten-qd"
version = "0.2.0"
edition = "2024"
description = "A terminal music player wearing an 80s car stereo — real EQ, real meters, real FM off an RTL-SDR, and a deck that writes down what it heard"
license = "MIT"
repository = "https://github.com/aaronsb/ten-qd"
readme = "README.md"
keywords = ["tui", "music-player", "audio", "sdr", "ratatui"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
cpal = "0.18.1"
crossbeam-channel = "0.5.16"
libc = "0.2.189"
mpris = "2.1.0"
ratatui = "0.30.2"
ringbuf = "0.5.1"
rtlsdr_mt = "2.2.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.0", features = ["flac", "mp3", "aac", "isomp4", "ogg", "vorbis", "wav", "alac", "pcm"] }
toml = "1.1.3"
walkdir = "2.5.0"
